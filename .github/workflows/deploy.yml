# Builds and publishes the site to GitHub Pages.
#
# On every push to main (or when run by hand from the Actions tab) this:
#   1. downloads the newest prebuilt OrcaSlicer WebAssembly engine
#   2. builds the printer/filament/process library from the matching
#      OrcaSlicer release
#   3. publishes everything to GitHub Pages
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

# Printer brands students can pick from. To add a brand, add its name to this
# line (for example: "Bambu, Snapmaker, Prusa, Creality, Custom") and commit.
# Leave it empty ("") to include every brand OrcaSlicer supports.
# "Custom" is OrcaSlicer's generic Klipper/Marlin/RRF printers, a good starting
# point for home-built printers. Your own printer files go in custom-printers/.
env:
  PRINTER_BRANDS: "Bambu, Snapmaker, Prusa, Custom"
  # Where the slicing engine comes from. "Hiosdra/OrcaWeb" is the standard
  # engine. After your own engine copy (with colour painting) has finished
  # building, change this to "Dover-Bay-Makerspace/OrcaWeb" and commit.
  ENGINE_REPO: "Hiosdra/OrcaWeb"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_tag:
        description: "Engine release tag (blank = newest)"
        required: false
        default: ""
      vendors:
        description: "Printer brands for this run only, comma-separated (blank = the PRINTER_BRANDS line in this file)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download slicing engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_TAG: ${{ github.event.inputs.engine_tag }}
          ENGINE_REPO: ${{ env.ENGINE_REPO }}
        run: bash tools/fetch-engine.sh

      - name: Get OrcaSlicer profiles and settings list matching the engine
        run: |
          ORCA_VERSION="$(cat engine/ORCA_VERSION)"
          echo "OrcaSlicer $ORCA_VERSION"
          git clone --depth 1 --branch "$ORCA_VERSION" --filter=blob:none --sparse \
            https://github.com/OrcaSlicer/OrcaSlicer.git "$RUNNER_TEMP/orca"
          git -C "$RUNNER_TEMP/orca" sparse-checkout set --no-cone \
            '/resources/profiles/*.json' '/resources/profiles/**/*.json' \
            '/src/libslic3r/PrintConfig.cpp' '/src/slic3r/GUI/Tab.cpp'

      - name: Build profile library
        env:
          BRANDS: ${{ github.event.inputs.vendors || env.PRINTER_BRANDS }}
        run: |
          python3 tools/build-profiles.py --orca "$RUNNER_TEMP/orca" --out profiles \
            --vendors "$BRANDS" --custom custom-printers

      - name: Build Advanced settings list
        run: python3 tools/build-settings-schema.py --orca "$RUNNER_TEMP/orca" --out settings-schema.json

      - name: Point the About box at this repository's source
        run: |
          python3 - <<'PY'
          import json, os
          cfg = json.load(open("config.json"))
          if not cfg.get("sourceUrl"):
              cfg["sourceUrl"] = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          json.dump(cfg, open("config.json", "w"), indent=2)
          PY

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html config.json settings-schema.json coi-serviceworker.min.js css js workers vendor engine profiles LICENSE NOTICE.md _site/
          touch _site/.nojekyll
          du -sh _site

      # Browsers keep site files for a few minutes. Stamping every script and
      # stylesheet with this deploy's version makes them always load a
      # matching set after an update (no mix of old and new files).
      - name: Stamp file versions
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(src=\"js/main\.js)\"#\1?v=$V\"#; s#(href=\"css/app\.css)\"#\1?v=$V\"#" _site/index.html
          find _site/js _site/workers -name '*.js' -exec sed -i -E \
            -e "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" \
            -e "s#(new URL\('\.\./workers/[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" {} +
          python3 - <<PY
          import json
          cfg = json.load(open("_site/config.json"))
          cfg["version"] = "$V"
          json.dump(cfg, open("_site/config.json", "w"), indent=2)
          PY
          grep -c "?v=$V" _site/index.html _site/js/*.js | head

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
